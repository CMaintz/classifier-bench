name: bootstrap
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * *'   # daily auto-prune - baseline shrinks on its own, one PR/day max
jobs:
  bootstrap:
    uses: CMaintz/foundry/.github/workflows/bootstrap.yml@v2
    with:
      working_directory: "."
      habit_hooks_plugin: "habit-hooks-generic"
    permissions: { contents: write, pull-requests: write }
