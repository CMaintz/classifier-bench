name: bootstrap
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * *'   # daily auto-prune - baseline shrinks on its own, one PR/day max
jobs:
  bootstrap:
    uses: CMaintz/foundry/.github/workflows/bootstrap.yml@0b0275720481eb4c064562dc65b85d292204398a # v2.11.0
    with:
      working_directory: "."
      habit_hooks_plugin: "habit-hooks-generic"
    permissions: { contents: write, pull-requests: write }
