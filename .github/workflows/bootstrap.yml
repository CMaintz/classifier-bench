name: bootstrap
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * *'   # daily auto-prune - baseline shrinks on its own, one PR/day max
jobs:
  bootstrap:
    uses: CMaintz/foundry/.github/workflows/bootstrap.yml@bc980e81bda32af3ef04b8149badf9529c3e6e84 # v2.9.0
    with:
      working_directory: "."
      habit_hooks_plugin: "habit-hooks-generic"
    permissions: { contents: write, pull-requests: write }
