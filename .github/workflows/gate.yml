name: gate
on: { pull_request: {}, push: { branches: [main] } }
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: CMaintz/foundry/.github/workflows/gate.yml@e71482dfb5914417d9675f1be1c6dd34699d0922   # v2.14.0   # the public facade - pin this, not the per-stack files
    with:
      stack: "python"
      working_directory: "."
