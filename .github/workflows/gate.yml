name: gate
on: { pull_request: {}, push: { branches: [main] } }
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: CMaintz/foundry/.github/workflows/gate.yml@bc980e81bda32af3ef04b8149badf9529c3e6e84   # v2.9.0   # the public facade - pin this, not the per-stack files
    with:
      stack: "python"
      working_directory: "."
