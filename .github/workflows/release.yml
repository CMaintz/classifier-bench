name: release
# Publishes to PyPI when a v* tag is pushed, via trusted publishing (OIDC): no API token
# is stored anywhere. PyPI must list this repo + workflow + the `pypi` environment as a
# trusted publisher for the project.
on:
  push:
    tags: ["v*"]
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Check the tag matches the package version
        run: |
          want="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != pyproject $want"; exit 1; }
      - run: python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0
      - run: python -m build && python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: dist, path: dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: pypi, url: "https://pypi.org/project/classifier-bench/" }
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
