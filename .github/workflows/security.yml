name: security
on: { pull_request: {}, push: { branches: [main] } }
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    uses: CMaintz/foundry/.github/workflows/security.yml@e71482dfb5914417d9675f1be1c6dd34699d0922   # v2.14.0   # facade: secret scan + ruleset-guard + SAST
    permissions: { contents: read, pull-requests: read }   # the secret scan lists the PR's commits
