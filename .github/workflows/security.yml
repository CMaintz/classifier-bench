name: security
on: { pull_request: {}, push: { branches: [main] } }
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    uses: CMaintz/foundry/.github/workflows/security.yml@664443a5d900c46353343c56ca8404954a0f8d63   # v2.13.0   # facade: secret scan + ruleset-guard + SAST
    permissions: { contents: read, pull-requests: read }   # the secret scan lists the PR's commits
