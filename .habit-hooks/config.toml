# Copy to <repo>/.habit-hooks/config.toml
# Structural smells come from the habit-hooks `python` sensor (ruff): high-complexity,
# too-many-parameters, oversized-function, swallowed-exception, plus unused-import and
# unused-variable; deptry adds unused-dependency. These are RATCHETED via the snooze
# baseline, not a hard wall. The `generic` plugin still adds file-length (below) and,
# opt-in, jscpd. Hard style/correctness/format stays with `ruff` in `mise run lint`.
# To avoid double-reporting, a consumer's ruff.toml should NOT also select the sensor's
# smell codes (C901/PLR0913/PLR0915/BLE001); let the sensor own those.
# deptry reports unused-dependency (DEP002) for declared-but-unimported deps. A repo that
# declares its dev tools under [project.optional-dependencies] will see those flagged - mark
# those groups as dev in [tool.deptry] (deptry's optional-dependencies-dev-groups) so the
# dev toolchain is not reported as unused.
plugins = ["python", "generic"]

# Tests are not smell-scanned (language-agnostic principle - see README).
files = ["**/*.py", "!**/tests/**", "!**/test_*.py", "!**/*_test.py"]

# File-length: flag files over 300 lines (oversized-file). 300 rather than the
# sensor default of 200 - verbose-but-cohesive files legitimately pass 200, and this is
# a ratcheted coaching signal, not a hard wall. Config/data/prose are already excluded by
# the `files` globs; keep big prompts in their own resource file.
[sensors.line-count]
args = ["--max", "300"]

# jscpd (the generic plugin's duplication detector) is a Node CLI. Disabled by default so
# the habits job stays Node-free (the python sensor's ruff + deptry and the generic
# line-count are all non-Node). To turn on Python duplication detection: install Node +
# `npm i -g jscpd` in the smells job, copy
# ../jscpd.json to <repo>/.jscpd.json (jscpd ignores the `files` list above), delete this
# block, then re-seed the snooze baseline.
[sensors.jscpd]
disabled = true
